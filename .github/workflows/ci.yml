# Build + vet + test on the platforms Phase 1 targets. Ubuntu needs
# Ebitengine's C build dependencies (GL, X11, ALSA) even for pure-Go
# builds, because its platform glue compiles against their headers.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true

      - name: Install Ebitengine build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xorg-dev libasound2-dev pkg-config xvfb

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The pure-Go playback-only fallback (README "Pure Go until it
      # can't be") must keep compiling without a C toolchain. This is a
      # Windows-only promise: Ebitengine and oto are pure Go on Windows
      # but require cgo (GLFW, ALSA) on Linux.
      - name: Build without cgo (playback-only fallback)
        if: runner.os == 'Windows'
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      # Ebitengine initializes GLFW at package init, which needs a display;
      # the Linux runner is headless, so tests run under a virtual
      # framebuffer (the same approach Ebitengine's own CI uses). The race
      # detector runs here because it is broken on some Windows setups.
      - name: Test (Linux, under xvfb, with race detector)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./... -count=1 -race

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./... -count=1

      # The optional ONNX pitch backend must keep compiling and its
      # non-inference tests keep passing. This needs no ONNX runtime or
      # model installed — the real-inference test skips without them —
      # so it is cheap insurance against binding drift.
      - name: Build and test the onnx-tagged backend
        run: go test -tags onnx ./internal/pitchml/... -count=1

      # The untagged binary must never link an ONNX runtime.
      - name: Assert the default build stays ONNX-free
        if: runner.os == 'Linux'
        run: |
          if go list -deps ./cmd/guitartutor | grep -q onnxruntime_go; then
            echo "::error::the default build pulled in onnxruntime_go; the onnx build tag leaked"
            exit 1
          fi
